services:
  - type: web
    name: chanceclub-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: ChanceClub API
      - key: APP_URL
        value: https://chanceclub-api.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://aawal-code.github.io
databases:
  - name: chanceclub-db
    plan: free
